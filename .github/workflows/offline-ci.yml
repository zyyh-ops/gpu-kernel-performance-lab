name: Offline release checks
on:
  push:
  pull_request:
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only project release gate (no CUDA needed)
        run: python scripts/release_check.py
